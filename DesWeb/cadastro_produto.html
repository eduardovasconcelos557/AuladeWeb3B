<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company's Name - Product/Item Registration Form</title>
</head>
<body>
    <h1 align="center">Company's Name - Product/Item Registration Form</h1>
    <h3 align="center">Register a product below</h3>
    <tabel align="center">
        <td align="center">
            <form>
                <label>Product's Name</label>
                <br>
                <input>
                <br><br>
                <label>Description</label>
                <br>
                <textarea rows="4" cols="50"></textarea>
                <br><br>
                <label>Measurement Unit</label>
                <br>
                <select>
                    <option>Select an option</option>
                    <option>Inches</option>
                    <option>Feet</option>
                    <option>Meters</option>
                    <option>Centimeters</option>
                    <option>Pieces</option>
                    <option>Liters</option>
                    <option>Ounces</option>
                    <option>Mililiters</option>
                </select>
                <br><br>
                <label>Quantity</label>
                <br>
                <input type="number">
                <br><br>
                <label>Price</label>
                <br>
                $ <input number>
                <br><br>
                <a href="principal.html"><button>Finish Registration</button></a>
                
            </form>
        </td>
    </tabel>
</body>
</html>
